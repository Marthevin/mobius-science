<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#000" data-tray-layer="infinity-particles">
    <!-- Left orbit: deliberately uneven spacing and particle sizes preserve the cosmic mark at 16px. -->
    <circle cx="32" cy="32" r="4.2"/>
    <circle cx="27.1" cy="25.6" r="3.1"/>
    <circle cx="22.3" cy="20.1" r="3.8"/>
    <circle cx="16.2" cy="16.9" r="2.8"/>
    <circle cx="10.4" cy="19.4" r="3.4"/>
    <circle cx="6.4" cy="25.1" r="2.5"/>
    <circle cx="5.2" cy="31.8" r="3.6"/>
    <circle cx="7.7" cy="38.5" r="2.8"/>
    <circle cx="13.3" cy="43.1" r="3.5"/>
    <circle cx="19.9" cy="45.2" r="2.5"/>
    <circle cx="25.9" cy="39.3" r="3.4"/>
    <circle cx="24.1" cy="34.5" r="2.2"/>

    <!-- Right orbit is related rather than mirrored, so the glyph reads as a particle field. -->
    <circle cx="37.3" cy="25.7" r="3.6"/>
    <circle cx="43.2" cy="20.2" r="2.8"/>
    <circle cx="49.7" cy="17.1" r="3.8"/>
    <circle cx="55.6" cy="20.8" r="3.1"/>
    <circle cx="59.1" cy="26.8" r="2.5"/>
    <circle cx="58.7" cy="33.8" r="3.5"/>
    <circle cx="55.2" cy="40.1" r="2.8"/>
    <circle cx="49.4" cy="44.7" r="3.4"/>
    <circle cx="42.8" cy="43.0" r="2.5"/>
    <circle cx="37.7" cy="38.4" r="3.1"/>
    <circle cx="40.3" cy="33.8" r="2.2"/>

    <!-- Sparse satellites keep the silhouette irregular without closing it into a solid stroke. -->
    <circle cx="18.8" cy="11.9" r="1.8"/>
    <circle cx="7.2" cy="14.4" r="1.4"/>
    <circle cx="2.5" cy="35.0" r="1.6"/>
    <circle cx="9.4" cy="49.4" r="1.8"/>
    <circle cx="24.7" cy="49.8" r="1.4"/>
    <circle cx="45.9" cy="12.4" r="1.6"/>
    <circle cx="59.5" cy="16.2" r="1.8"/>
    <circle cx="62.0" cy="31.0" r="1.4"/>
    <circle cx="56.5" cy="48.5" r="1.6"/>
    <circle cx="41.1" cy="49.6" r="1.8"/>
  </g>
</svg>

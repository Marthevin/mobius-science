<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Mobius Science Remote" />
    <meta name="apple-mobile-web-app-title" content="Mobius Science Remote" />
    <title>Mobius Science Remote</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; media-src 'self' https: blob:; frame-src 'self'; connect-src 'self' ws: wss:"
    />
    <style>
      /* Match the renderer startup surface before its stylesheet has loaded. */
      :root {
        --connection-background: #fafaf8;
        --connection-foreground: #202321;
        --connection-muted: #646762;
      }
      .dark {
        --connection-background: #1a1a18;
        --connection-foreground: #e8e6df;
        --connection-muted: #a8a49a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --connection-background: #1a1a18;
          --connection-foreground: #e8e6df;
          --connection-muted: #a8a49a;
        }
      }
      body {
        margin: 0;
      }
      .open-science-connection-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3.5rem;
        text-align: center;
        max-width: min(420px, calc(100vw - 3rem));
      }
      .open-science-connection-logo {
        display: block;
        width: 42px;
        height: 42px;
        flex: none;
        overflow: hidden;
        border-radius: 11px;
        box-shadow: 0 5px 18px rgba(29, 45, 112, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="open-science-connection-state"
        role="status"
        aria-live="polite"
        style="
          box-sizing: border-box;
          display: grid;
          min-height: 100svh;
          place-items: center;
          background: var(--connection-background);
          color: var(--connection-foreground);
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
        "
      >
        <div class="open-science-connection-panel">
          <div class="open-science-connection-brand">
            <span
              id="open-science-connection-logo"
              class="open-science-connection-logo"
              aria-hidden="true"
            ></span>
            <div class="open-science-connection-name">Mobius Science</div>
          </div>
          <div class="open-science-connection-progress">
            <span class="open-science-connection-spinner" aria-hidden="true"></span>
            <p
              id="open-science-connection-message"
              style="margin: 0; color: var(--connection-muted); font-size: 14px; line-height: 1.6"
            >
              Connecting to remote computer…
            </p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/bootstrap.ts"></script>
  </body>
</html>
